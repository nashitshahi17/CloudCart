name: CloudCart CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: frontend
            context: ./frontend

          - name: api-gateway
            context: ./api-gateway

          - name: user-service
            context: ./services/user-service

          - name: product-service
            context: ./services/product-service

          - name: cart-service
            context: ./services/cart-service

          - name: order-service
            context: ./services/order-service

          - name: payment-service
            context: ./services/payment-service

          - name: notification-service
            context: ./services/notification-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm Lint
        run: helm lint ./helm/cloudcart

      - name: Helm Template Validation
        run: helm template cloudcart ./helm/cloudcart > /dev/null

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/cloudcart-${{ matrix.name }}:latest \
            -t ghcr.io/${{ github.repository_owner }}/cloudcart-${{ matrix.name }}:${{ github.sha }} \
            ${{ matrix.context }}

      - name: Push Docker Image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/cloudcart-${{ matrix.name }}:latest
          docker push ghcr.io/${{ github.repository_owner }}/cloudcart-${{ matrix.name }}:${{ github.sha }}