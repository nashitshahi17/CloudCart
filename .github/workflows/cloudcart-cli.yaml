
name: CloudCart CI - Azure ACR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: ./frontend

          - name: api-gateway
            context: ./api-gateway

          - name: user-service
            context: ./services/user-service

          - name: product-service
            context: ./services/product-service

          - name: cart-service
            context: ./services/cart-service

          - name: order-service
            context: ./services/order-service

          - name: payment-service
            context: ./services/payment-service

          - name: notification-service
            context: ./services/notification-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm Lint
        if: matrix.name == 'frontend'
        run: helm lint ./helm/cloudcart -f ./helm/cloudcart/values-azure.yaml

      - name: Helm Template Validation
        if: matrix.name == 'frontend'
        run: |
          helm template cloudcart ./helm/cloudcart \
            -f ./helm/cloudcart/values-azure.yaml \
            --namespace cloudcart > /dev/null

      - name: Azure Login using OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: az acr login --name cloudcartdeploymentregistory

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/cloudcart-${{ matrix.name }}:${{ github.sha }}
            ${{ vars.ACR_LOGIN_SERVER }}/cloudcart-${{ matrix.name }}:latest
