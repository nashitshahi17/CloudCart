apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-gateway
  namespace: cloudcart

  labels:
    app: api-gateway

spec:

  replicas: 2

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

  selector:
    matchLabels:
      app: api-gateway

  template:

    metadata:
      labels:
        app: api-gateway

    spec:

      containers:

      - name: api-gateway

        image: cloudcart-api-gateway:v1

        imagePullPolicy: Never

        ports:
        - containerPort: 5000

        envFrom:

        - configMapRef:
            name: api-gateway-config

        resources:

          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        readinessProbe:

          httpGet:
            path: /health
            port: 5000

          initialDelaySeconds: 10
          periodSeconds: 5

        livenessProbe:

          httpGet:
            path: /health
            port: 5000

          initialDelaySeconds: 20
          periodSeconds: 10