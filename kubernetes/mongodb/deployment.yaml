apiVersion: apps/v1

kind: Deployment

metadata:
  name: mongodb

  namespace: cloudcart

  labels:
    app: mongodb

spec:

  replicas: 1

  selector:
    matchLabels:
      app: mongodb

  template:

    metadata:

      labels:
        app: mongodb

    spec:

      containers:

        - name: mongodb

          image: mongo:7

          imagePullPolicy: IfNotPresent

          ports:

            - containerPort: 27017

          env:

            - name: MONGO_INITDB_DATABASE

              value: cloudcart

          resources:

            requests:
              cpu: "250m"

              memory: "256Mi"

            limits:
              cpu: "500m"

              memory: "512Mi"

          volumeMounts:

            - name: mongodb-storage

              mountPath: /data/db

      volumes:

        - name: mongodb-storage

          persistentVolumeClaim:

            claimName: mongodb-pvc