apiVersion: apps/v1

kind: Deployment

metadata:
  name: user-service
  namespace: cloudcart

  labels:
    app: user-service

spec:

  replicas: 2

  selector:
    matchLabels:
      app: user-service

  template:

    metadata:
      labels:
        app: user-service

    spec:

      containers:

        - name: user-service

          image: cloudcart-user-service:v1

          imagePullPolicy: Never

          ports:

            - containerPort: 8000

          envFrom:

            - configMapRef:
                name: user-service-config

            - secretRef:
                name: cloudcart-secret

          resources:

            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:

            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 20
            periodSeconds: 10

          readinessProbe:

            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 10
            periodSeconds: 5