apiVersion: apps/v1
kind: Deployment

metadata:
  name: cart-service
  namespace: cloudcart

  labels:
    app: cart-service

spec:

  replicas: 2

  strategy:

    type: RollingUpdate

    rollingUpdate:

      maxUnavailable: 1

      maxSurge: 1

  selector:

    matchLabels:

      app: cart-service

  template:

    metadata:

      labels:

        app: cart-service

    spec:

      containers:

        - name: cart-service

          image: cloudcart-cart-service:v1

          imagePullPolicy: Never

          ports:

            - containerPort: 8003

          envFrom:

            - configMapRef:
                name: cart-service-config

            - secretRef:
                name: cloudcart-secret

          resources:

            requests:

              cpu: "100m"

              memory: "128Mi"

            limits:

              cpu: "500m"

              memory: "512Mi"

          readinessProbe:

            httpGet:

              path: /health

              port: 8003

            initialDelaySeconds: 10

            periodSeconds: 5

          livenessProbe:

            httpGet:

              path: /health

              port: 8003

            initialDelaySeconds: 20

            periodSeconds: 10