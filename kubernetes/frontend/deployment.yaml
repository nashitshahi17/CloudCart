apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: cloudcart

  labels:
    app: frontend

spec:

  replicas: 2

  strategy:

    type: RollingUpdate

    rollingUpdate:

      maxUnavailable: 1

      maxSurge: 1

  selector:

    matchLabels:

      app: frontend

  template:

    metadata:

      labels:

        app: frontend

    spec:

      containers:

      - name: frontend

        image: cloudcart-frontend:v1

        imagePullPolicy: Never

        ports:

        - containerPort: 80

        resources:

          requests:

            cpu: "100m"

            memory: "128Mi"

          limits:

            cpu: "500m"

            memory: "512Mi"

        readinessProbe:

          httpGet:

            path: /

            port: 80

          initialDelaySeconds: 5

          periodSeconds: 5

        livenessProbe:

          httpGet:

            path: /

            port: 80

          initialDelaySeconds: 15

          periodSeconds: 10